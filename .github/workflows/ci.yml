name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      # Unit tests need no WSL and no SCRAM. The engine tests (npm run test:engine) and the browser tests (npm run e2e) are not run here.
      - run: npm test
      - run: npx vite build
